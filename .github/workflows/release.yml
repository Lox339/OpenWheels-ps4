# Builds OpenWheels for PlayStation 4 and publishes OpenWheels-ps4.pkg as a GitHub release.
#
#   PS4    OpenWheels-ps4.pkg    FPKG for 5.05+
#
# Game files: the repository never contains Happy Wheels assets. The packages are built with the
# game data of a previous OpenWheels release (its Windows zip: assets/, generated/, ios/ and the
# tables; see tools/release/extract_game_data.py), by default the latest release, or with a zip at
# the URL in the OW_GAME_DATA_URL secret.
#
# Triggers:
#   * pushing a tag v*        builds and publishes the release for that tag;
#   * Actions -> Release -> Run workflow: builds artifacts; with a tag it creates the release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.3.1). Empty = build artifacts only.'
        required: false
        default: ''
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: true
      data_release:
        description: 'Release whose Windows zip provides the game files (empty = latest release)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE_CACHE_VERSION: 1

jobs:
  game-data:
    name: Game data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the game data of a previous release
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_URL: ${{ secrets.OW_GAME_DATA_URL }}
          DATA_RELEASE: ${{ inputs.data_release }}
        run: |
          set -euo pipefail
          mkdir -p dl
          if [ -n "${DATA_URL}" ]; then
            curl -fsSL -o dl/package.zip "${DATA_URL}"
          else
            # The newest published release that has a Windows zip (the tag being built may
            # already exist as a release without one).
            tags="${DATA_RELEASE}"
            if [ -z "${tags}" ]; then
              tags="$(gh release list -R "${GITHUB_REPOSITORY}" --exclude-drafts --limit 30 --json tagName -q '.[].tagName')"
            fi
            for tag in ${tags}; do
              if gh release download "${tag}" -R "${GITHUB_REPOSITORY}" -p OpenWheels-windows.zip -D dl --clobber; then
                echo "game data from release ${tag}"
                mv dl/OpenWheels-windows.zip dl/package.zip
                break
              fi
            done
            if [ ! -f dl/package.zip ]; then
              echo "Checking upstream officialmelon/OpenWheels for releases..."
              upstream_tags="$(gh release list -R "officialmelon/OpenWheels" --limit 10 --json tagName -q '.[].tagName' 2>/dev/null || true)"
              for tag in ${upstream_tags}; do
                if gh release download "${tag}" -R "officialmelon/OpenWheels" -p OpenWheels-windows.zip -D dl --clobber; then
                  echo "game data from upstream release ${tag}"
                  mv dl/OpenWheels-windows.zip dl/package.zip
                  break
                fi
              done
            fi
            [ -f dl/package.zip ] || { echo "::error::no release with OpenWheels-windows.zip found"; exit 1; }
          fi
          python3 tools/release/extract_game_data.py dl/package.zip game-data
      - name: Draw missing restored-character portraits
        run: |
          python3 -m pip install --quiet numpy pillow
          python3 tools/assets/restored_portraits.py --optional --out game-data/generated/restored
      - uses: actions/upload-artifact@v4
        with:
          name: game-data
          path: game-data
          retention-days: 1

  ps4:
    name: PlayStation 4
    needs: game-data
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools, Wine and archive tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang lld llvm cmake ninja-build wine64 python3 unar
          if [ ! -f /usr/local/bin/wine ] && [ -f /usr/bin/wine64 ]; then
            sudo ln -sf /usr/bin/wine64 /usr/local/bin/wine
          fi
      - name: Setup OpenOrbis Toolchain
        run: |
          echo "Setting up OpenOrbis PS4 Toolchain..."
          curl -fLJO https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz || \
          (curl -fLJO https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/toolchain-llvm-18.2.zip && unzip -q toolchain*.zip)
          tar -xzf toolchain-llvm-*.tar.gz -C ./ || true
          echo "OO_PS4_TOOLCHAIN=${PWD}/OpenOrbis/PS4Toolchain" >> "${GITHUB_ENV}"
          echo "${PWD}/OpenOrbis/PS4Toolchain/bin/linux" >> "${GITHUB_PATH}"
      - name: Setup PS4 Portlibs (zlib, libpng, curl)
        run: |
          chmod +x tools/setup_ps4_portlibs.sh
          tools/setup_ps4_portlibs.sh
      - name: Setup CyB1K PS4 Fake PKG Tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYB1K_URL: ${{ secrets.CYB1K_TOOLS_URL }}
          CYB1K_PAT: ${{ secrets.CYB1K_TOKEN }}
        run: |
          mkdir -p tools/ps4_fake_pkg_tools
          if [ -n "${CYB1K_URL:-}" ]; then
            echo "Downloading Fake PKG Tools from custom URL..."
            curl -fL -o pkgtools.archive "${CYB1K_URL}"
            unar -D -f -o tools/ps4_fake_pkg_tools pkgtools.archive
          elif [ -n "${CYB1K_PAT:-}" ]; then
            echo "Cloning Fake PKG Tools with secret token..."
            git clone --depth 1 "https://${CYB1K_PAT}@github.com/CyB1K/PS4-Fake-PKG-Tools-3.87.git" tools/ps4_fake_pkg_tools
          else
            echo "Downloading CyB1K PS4 Fake PKG Tools V7 release..."
            curl -fL -o pkgtools.rar "https://github.com/CyB1K/PS4-Fake-PKG-Tools-3.87/releases/download/v7/PS4_Fake_PKG_Tools_3.87_V7.rar"
            unar -D -f -o tools/ps4_fake_pkg_tools pkgtools.rar
          fi
          echo "CYB1K_TOOLS_DIR=${PWD}/tools/ps4_fake_pkg_tools" >> "${GITHUB_ENV}"
          find "${PWD}/tools/ps4_fake_pkg_tools" -iname "*orbis-pub-cmd*.exe" || true
      - uses: actions/cache@v4
        with:
          path: thirdparty/cocos2d-x
          key: engine-posix-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('tools/fetch_engine.sh', 'thirdparty/patches/*.patch') }}
      - name: Fetch cocos2d-x
        run: tools/fetch_engine.sh
      - uses: actions/download-artifact@v4
        with:
          name: game-data
          path: game-data
      - name: Build for PS4
        run: |
          cmake -S . -B build-ps4 \
            -DCMAKE_TOOLCHAIN_FILE=tools/ps4.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DOW_WITH_PC_LAYER=OFF
          cmake --build build-ps4 --config Release -j$(nproc)
      - name: Package (.pkg FPKG)
        run: |
          tools/package_ps4.sh --build-dir build-ps4 --out dist \
            --assets game-data/assets --ios game-data/ios --data game-data \
            --tools-dir "${CYB1K_TOOLS_DIR}"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWheels-ps4
          path: dist/OpenWheels-ps4.pkg

  release:
    name: Publish release
    needs: [ps4]
    if: >-
      always() &&
      needs.ps4.result == 'success' &&
      (github.event_name == 'push' || inputs.tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenWheels-*
          path: packages
          merge-multiple: true
      - name: Release notes
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          awk -v v="## ${TAG}" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "OpenWheels ${TAG}" > notes.md
          {
            echo
            echo "## Downloads"
            echo "- **PlayStation 4:** \`OpenWheels-ps4.pkg\` (Fake PKG for 5.05+)."
            echo
            echo "## Legal"
            echo "OpenWheels is an unofficial fan project. Happy Wheels and its assets belong to Fancy Force / Jim Bonacci. See [NOTICE.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/NOTICE.md)."
          } >> notes.md
          (cd packages && sha256sum -- * > SHA256SUMS.txt)
          ls -la packages
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          set -euo pipefail
          args=(--title "OpenWheels ${TAG}" --notes-file notes.md --target "${GITHUB_SHA}")
          [ "${DRAFT}" = "true" ] && args+=(--draft)
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" packages/* -R "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" -R "${GITHUB_REPOSITORY}" --title "OpenWheels ${TAG}" \
              --notes-file notes.md --target "${GITHUB_SHA}" --draft="${DRAFT:-false}"
            [ "${DRAFT}" = "true" ] || gh release edit "${TAG}" -R "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "${TAG}" packages/* -R "${GITHUB_REPOSITORY}" "${args[@]}"
          fi
