<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Sky -->
    <linearGradient id="iconSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="35%" stop-color="#1E88E5"/>
      <stop offset="70%" stop-color="#64B5F6"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Hazard Striping -->
    <pattern id="hazardPatternSmall" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#D32F2F"/>
      <rect x="12" width="12" height="24" fill="#FFFFFF"/>
    </pattern>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base (PS4 Icon 512x512) -->
  <rect width="512" height="512" fill="url(#iconSky)"/>

  <!-- Sun Rays Circle Behind Racer -->
  <circle cx="256" cy="220" r="160" fill="#FFF59D" opacity="0.35"/>
  <circle cx="256" cy="220" r="100" fill="#FFF9C4" opacity="0.45"/>

  <!-- Rolling Hill Base & Ramp -->
  <path d="M 0,380 Q 140,320 280,350 T 512,330 L 512,512 L 0,512 Z" fill="#388E3C"/>
  <path d="M 0,420 Q 180,390 350,430 T 512,410 L 512,512 L 0,512 Z" fill="#5D4037"/>

  <!-- Stunt Ramp with Hazard Stripes -->
  <polygon points="40,430 160,330 190,330 70,430" fill="#455A64" stroke="#212121" stroke-width="3"/>
  <polygon points="48,425 152,335 178,335 68,425" fill="url(#hazardPatternSmall)"/>

  <!-- Deadly Saw Hazard in Background -->
  <g transform="translate(420, 320) scale(0.6)" opacity="0.9">
    <path d="M 0,-50 L 12,-35 L 35,-35 L 35,-12 L 50,0 L 35,12 L 35,35 L 12,35 L 0,50 L -12,35 L -35,35 L -35,12 L -50,0 L -35,-12 L -35,-35 L -12,-35 Z"
          fill="#CFD8DC" stroke="#263238" stroke-width="4"/>
    <circle cx="0" cy="0" r="18" fill="#78909C"/>
    <circle cx="0" cy="0" r="6" fill="#212121"/>
  </g>

  <!-- Wheelchair Racer Leaping Forward -->
  <g transform="translate(250, 230) rotate(-14)" filter="url(#shadowFilter)">
    <!-- Speed streaks -->
    <line x1="-120" y1="-10" x2="-40" y2="-5" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="-150" y1="25" x2="-30" y2="28" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <line x1="-100" y1="55" x2="-45" y2="52" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <!-- Large Wheel -->
    <circle cx="0" cy="40" r="50" fill="none" stroke="#212121" stroke-width="14"/>
    <circle cx="0" cy="40" r="50" fill="none" stroke="#ECEFF1" stroke-width="4"/>
    <circle cx="0" cy="40" r="12" fill="#212121"/>
    <!-- Spokes -->
    <line x1="-45" y1="40" x2="45" y2="40" stroke="#CFD8DC" stroke-width="3"/>
    <line x1="0" y1="-5" x2="0" y2="85" stroke="#CFD8DC" stroke-width="3"/>
    <line x1="-32" y1="8" x2="32" y2="72" stroke="#CFD8DC" stroke-width="3"/>
    <line x1="-32" y1="72" x2="32" y2="8" stroke="#CFD8DC" stroke-width="3"/>

    <!-- Small Front Wheel -->
    <circle cx="70" cy="75" r="16" fill="none" stroke="#212121" stroke-width="8"/>

    <!-- Wheelchair Frame -->
    <path d="M 0,40 L 65,72 L 48,25 L -5,20 Z" fill="#D32F2F" stroke="#212121" stroke-width="4"/>
    <path d="M -5,20 L -18,-35 L 28,-18 L 22,25" fill="#B71C1C" stroke="#212121" stroke-width="4"/>

    <!-- Rocket Thruster with Blast -->
    <polygon points="-28,10 -75,5 -70,38 -22,32" fill="#37474F" stroke="#212121" stroke-width="3"/>
    <polygon points="-75,8 -140,22 -70,36 -100,22" fill="#FF5722"/>
    <polygon points="-75,12 -110,22 -70,30" fill="#FFEB3B"/>

    <!-- Wheelchair Guy Character -->
    <!-- Green Shirt -->
    <path d="M 5,-28 L 38,-16 L 50,-68 L 16,-74 Z" fill="#43A047" stroke="#1B5E20" stroke-width="4"/>
    <!-- Arm -->
    <path d="M 28,-58 L 62,-28 L 18,12" fill="none" stroke="#FDD835" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 28,-58 L 62,-28 L 18,12" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Blue Slacks -->
    <path d="M 28,-16 L 68,-5 L 82,38" fill="none" stroke="#1E88E5" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Head -->
    <circle cx="38" cy="-96" r="22" fill="#FFE082" stroke="#212121" stroke-width="3"/>
    <!-- Red Helmet -->
    <path d="M 16,-96 C 16,-124 60,-124 64,-92 C 60,-88 44,-85 28,-85 Z" fill="#E53935" stroke="#B71C1C" stroke-width="4"/>
    <!-- Sunglasses / Glasses -->
    <rect x="38" cy="-100" width="16" height="9" rx="2" fill="#212121"/>
    <!-- Red Tie -->
    <polygon points="18,-62 -16,-54 -10,-44 22,-56" fill="#E53935"/>
  </g>

  <!-- Big Bold OPENWHEELS Typography Across Bottom -->
  <g transform="translate(256, 450)" filter="url(#shadowFilter)">
    <!-- Shadow Extrusion -->
    <text x="0" y="6" text-anchor="middle"
          font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64"
          letter-spacing="2" fill="#B71C1C" stroke="#000000" stroke-width="14" stroke-linejoin="round">
      OPENWHEELS
    </text>

    <!-- Main Gradient Text -->
    <text x="0" y="0" text-anchor="middle"
          font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64"
          letter-spacing="2" fill="url(#logoGrad)" stroke="#FFFFFF" stroke-width="3">
      OPENWHEELS
    </text>
  </g>

  <!-- PS4 Badge Top Left -->
  <g transform="translate(18, 18)">
    <rect width="90" height="32" rx="6" fill="#0D47A1" stroke="#42A5F5" stroke-width="2"/>
    <text x="45" y="22" text-anchor="middle"
          font-family="'Arial Black', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">
      PS4™
    </text>
  </g>

  <!-- Clean Outer Border Frame -->
  <rect x="0" y="0" width="512" height="512" fill="none" stroke="#000000" stroke-width="6"/>
</svg>
